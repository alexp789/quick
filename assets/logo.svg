<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A14" />
    </linearGradient>

    <!-- Speed Arc Gradient -->
    <linearGradient id="speedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Runner Core Gradient -->
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Icon Container (Rounded Squircle) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Stopwatch Top Button Crown -->
  <g filter="url(#dropShadow)">
    <rect x="236" y="52" width="40" height="24" rx="6" fill="#64748B" />
    <rect x="246" y="74" width="20" height="18" fill="#475569" />
    
    <!-- Top-Right Lap / Split Push Button (Angled 45 deg) -->
    <g transform="rotate(45 368 144)">
      <rect x="352" y="108" width="32" height="18" rx="5" fill="#38BDF8" />
    </g>
  </g>

  <!-- Outer Chronometer Dial Frame -->
  <circle cx="256" cy="276" r="168" fill="none" stroke="#1E293B" stroke-width="22" opacity="0.8" />

  <!-- Dynamic Glowing Speed Arc (Active Timing) -->
  <circle
    cx="256"
    cy="276"
    r="168"
    fill="none"
    stroke="url(#speedGrad)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="1055"
    stroke-dashoffset="340"
    transform="rotate(-110 256 276)"
    filter="url(#glow)"
  />

  <!-- Dial Precision Tick Marks -->
  <g stroke="#64748B" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="256" y1="124" x2="256" y2="136" />
    <line x1="398" y1="276" x2="410" y2="276" />
    <line x1="256" y1="418" x2="256" y2="430" />
    <line x1="102" y1="276" x2="114" y2="276" />
  </g>

  <!-- Modern Dynamic Sprinting Runner Symbol -->
  <g filter="url(#dropShadow)" transform="translate(16, 26)">
    <!-- Runner Head -->
    <circle cx="270" cy="172" r="22" fill="url(#runnerGrad)" />

    <!-- Runner Torso & Momentum -->
    <path
      d="M232 284 L268 206 C272 198 284 198 290 206 L324 252 L360 258"
      fill="none"
      stroke="url(#runnerGrad)"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Runner Trailing Arm (Back Drive) -->
    <path
      d="M260 226 L224 246 L196 242"
      fill="none"
      stroke="url(#speedGrad)"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Runner Lead Leg (High Knee Sprint Drive) -->
    <path
      d="M232 284 L282 308 L318 368"
      fill="none"
      stroke="url(#runnerGrad)"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Runner Rear Leg (Full Extension Push-off) -->
    <path
      d="M232 284 L180 302 L144 348"
      fill="none"
      stroke="url(#speedGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Speed Motion Streaks (Left Side) -->
  <g stroke="url(#speedGrad)" stroke-linecap="round" opacity="0.8" filter="url(#glow)">
    <line x1="110" y1="240" x2="150" y2="240" stroke-width="7" />
    <line x1="90" y1="270" x2="140" y2="270" stroke-width="9" />
    <line x1="115" y1="300" x2="160" y2="300" stroke-width="7" />
  </g>

  <!-- Lightning Precision Bolt Accent at Bottom Right -->
  <path
    d="M345 375 L372 342 L356 342 L378 312"
    fill="none"
    stroke="#38BDF8"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
