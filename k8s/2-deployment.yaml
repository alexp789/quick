apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-web
  namespace: quick
  labels:
    app: quick-web
    app.kubernetes.io/name: quick-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quick-web
  template:
    metadata:
      labels:
        app: quick-web
    spec:
      containers:
        - name: web
          image: ghcr.io/alexp789/quick:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: quick-service
  namespace: quick
  labels:
    app: quick-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: quick-web
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: quick
  namespace: quick
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`quick.chickenrat.co.uk`)
      kind: Rule
      services:
        - name: quick-service
          port: 80
  tls:
    certResolver: tlsresolver
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-secure
  namespace: quick
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: quick-web
  namespace: quick
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`quick.chickenrat.co.uk`)
      kind: Rule
      services:
        - name: quick-service
          port: 80
      middlewares:
        - name: quick-redirect-secure@kubernetescrd
