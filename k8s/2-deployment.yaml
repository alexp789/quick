apiVersion: apps/v1
kind: Deployment
metadata:
  name: quick-web
  namespace: quick
  labels:
    app: quick-web
    app.kubernetes.io/name: quick-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quick-web
  template:
    metadata:
      labels:
        app: quick-web
    spec:
      containers:
        - name: web
          image: ghcr.io/alexp789/quick:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
---
apiVersion: v1
kind: Service
metadata:
  name: quick-service
  namespace: quick
  labels:
    app: quick-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: quick-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quick-ingress
  namespace: quick
  labels:
    app: quick-web
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: quick.chickenrat.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quick-service
                port:
                  number: 80
  tls:
    - hosts:
        - quick.chickenrat.co.uk
      secretName: quick-tls-secret
